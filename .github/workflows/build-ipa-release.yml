name: Build and release SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Build and package IPA
        run: |
          set -euo pipefail

          make -B build 2>&1 | xcbeautify --renderer github-actions

          # SideStore's build creates SideBackup.ipa separately, but the
          # signing/package stage expects it to be embedded in SideStore.app.
          test -s build/SideBackup.ipa

          APP_PATH="$(find build -type d -name 'SideStore.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find SideStore.app under build/"
            find build -maxdepth 5 -print
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          cp build/SideBackup.ipa "$APP_PATH/SideBackup.ipa"
          test -s "$APP_PATH/SideBackup.ipa"

          make fakesign
          make ipa

      - name: Verify IPA
        run: |
          test -s SideStore.ipa
          unzip -tq SideStore.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile("SideStore.ipa") as ipa:
              app = "Payload/SideStore.app/"
              info = plistlib.loads(ipa.read(app + "Info.plist"))
              assert ipa.getinfo(app + info["CFBundleExecutable"]).file_size > 0
          PY

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: SideStore.ipa
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="ipa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          COMMIT=$(git rev-parse HEAD)
          printf 'SideStore IPA built from commit %s.\n\nBuild: %s/%s/actions/runs/%s\n\nInstall with a sideloading tool to sign it for your device.\n' \
            "$COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          RELEASE_URL=$(gh release create "$RELEASE_TAG" SideStore.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "SideStore IPA (${COMMIT:0:8})" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false)
          printf 'Download [SideStore.ipa](%s/download/%s/SideStore.ipa).\n\n[View release](%s).\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" "$RELEASE_TAG" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
